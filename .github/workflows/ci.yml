name: CI/CD Pipeline

on:
  push:
    branches: [ main, development, uat ]
  pull_request:
    branches: [ main, development, uat ]

env:
  PHP_VERSION: '8.3'

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test --preset=psr12

  static-analysis:
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

  tests:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Copy CI environment file
        run: cp .env.ci .env
      - name: Generate app key
        run: php artisan key:generate
      - name: Run migrations
        run: php artisan migrate --force
      - name: Run tests with coverage
        run: php artisan test --coverage --min=50

  deploy-simulation:
    runs-on: ubuntu-latest
    needs: tests
    if: success()
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "development" ]]; then
            echo "ENV=dev" >> $GITHUB_OUTPUT
            echo "DEPLOY_ENV=Development" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "uat" ]]; then
            echo "ENV=uat" >> $GITHUB_OUTPUT
            echo "DEPLOY_ENV=UAT" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "DEPLOY_ENV=Production" >> $GITHUB_OUTPUT
          fi
      - name: Copy environment file
        run: cp .env.${{ steps.env.outputs.ENV }} .env
      - name: Deploy to ${{ steps.env.outputs.DEPLOY_ENV }}
        run: |
          echo "========================================="
          echo "Deploying to ${{ steps.env.outputs.DEPLOY_ENV }} with .env.${{ steps.env.outputs.ENV }}"
          echo "========================================="
          cat .env | grep APP_

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-simulation
    if: github.ref_name == 'main' && success()
    environment:
      name: production
      url: https://example.com
    steps:
      - uses: actions/checkout@v4
      - name: Copy production environment file
        run: cp .env.prod .env
      - name: Production Deployment
        run: |
          echo "========================================="
          echo "🚀 DEPLOYING TO PRODUCTION (MANUAL APPROVAL REQUIRED)"
          echo "Using .env.prod"
          echo "========================================="

  send-notification:
    runs-on: ubuntu-latest
    needs: [tests, deploy-simulation, deploy-production]
    if: always()
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.yandex.ru
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI/CD Pipeline - ${{ github.repository }} - ${{ job.status }}"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            📊 CI/CD Pipeline Report
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            📋 Job Results:
            - Linting: ${{ needs.linting.result }}
            - Static Analysis: ${{ needs.static-analysis.result }}
            - Tests: ${{ needs.tests.result }}
            - Deploy Simulation: ${{ needs.deploy-simulation.result }}
            - Deploy Production: ${{ needs.deploy-production.result }}
            
            Overall Status: ${{ job.status }}
